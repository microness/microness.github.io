name: 사이트 배포

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 이슈는 저장소 주인이 연 것만 시로 받는다 (다른 사람이 연 이슈는 무시)
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 처음 올린 날짜를 알려면 전체 기록이 필요

      - name: 이슈를 txt로 저장
        id: issue
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 add_from_issue.py

      - name: txt 커밋
        if: github.event_name == 'issues'
        env:
          FILE: ${{ steps.issue.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "시 추가: $FILE"
          git push

      - name: HTML 만들기
        run: python3 build.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: 이슈 닫기
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          FILE: ${{ steps.issue.outputs.file }}
        run: |
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "등록했습니다: $FILE"
